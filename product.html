<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fragrance | Casa Aura</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #090909;
      color: #f4eee4;
      font-family: "Inter", sans-serif;
      font-weight: 300;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .header {
      border-bottom: 1px solid #222;
      padding: 24px 6%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-family: "Cormorant Garamond", serif;
      font-size: 26px;
      letter-spacing: 3px;
      color: #d8b56a;
    }

    .back {
      color: #aaa;
      font-size: 13px;
      letter-spacing: 1px;
    }

    .back:hover {
      color: #d8b56a;
    }

    .product-page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 80px 30px 120px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 80px;
      align-items: center;
    }

    .product-image {
      height: 600px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background:
        radial-gradient(circle at center,
          rgba(80, 220, 230, 0.12),
          #151515 65%);
      border: 1px solid #242424;
      overflow: hidden;
    }

    .product-image::before {
      content: "";
      position: absolute;
      width: 70%;
      height: 70%;
      background: radial-gradient(
        circle,
        rgba(80, 220, 230, 0.22) 0%,
        rgba(80, 220, 230, 0.08) 40%,
        transparent 72%
      );
      filter: blur(25px);
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 35px;
      position: relative;
      z-index: 2;
      filter:
        drop-shadow(0 0 15px rgba(80, 220, 230, 0.35))
        drop-shadow(0 0 35px rgba(80, 220, 230, 0.22));
    }

    .product-details {
      padding: 20px 0;
    }

    .brand {
      color: #b9934e;
      font-size: 12px;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    h1 {
      font-family: "Cormorant Garamond", serif;
      font-size: 52px;
      font-weight: 400;
      margin: 0 0 22px;
      line-height: 1;
    }

    .description {
      color: #aaa;
      font-size: 15px;
      line-height: 1.8;
      margin-bottom: 28px;
      max-width: 500px;
    }

    .notes-title {
      color: #d8b56a;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .notes {
      color: #888;
      font-size: 13px;
      line-height: 1.7;
      margin-bottom: 35px;
    }

    .size-title {
      color: #d8b56a;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .sizes {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 24px;
    }

    .size-button {
      min-width: 75px;
      padding: 13px 18px;
      background: transparent;
      color: #aaa;
      border: 1px solid #333;
      cursor: pointer;
      font-family: "Inter", sans-serif;
      font-size: 13px;
      transition: 0.2s;
    }

    .size-button:hover,
    .size-button.active {
      border-color: #d8b56a;
      color: #d8b56a;
    }

    .price {
      font-family: "Cormorant Garamond", serif;
      font-size: 30px;
      color: #f4eee4;
      margin-bottom: 25px;
    }

    .inventory {
      color: #777;
      font-size: 12px;
      margin-bottom: 18px;
    }

    .add-cart {
      width: 100%;
      max-width: 420px;
      padding: 17px 25px;
      border: 1px solid #d8b56a;
      background: #d8b56a;
      color: #090909;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: 0.2s;
    }

    .add-cart:hover {
      background: transparent;
      color: #d8b56a;
    }

    .message {
      color: #d8b56a;
      font-size: 13px;
      margin-top: 15px;
      min-height: 20px;
    }

    .loading,
    .error {
      text-align: center;
      padding: 120px 20px;
      color: #999;
    }

    @media (max-width: 800px) {
      .product-page {
        grid-template-columns: 1fr;
        gap: 40px;
        padding: 40px 20px 80px;
      }

      .product-image {
        height: 430px;
      }

      h1 {
        font-size: 42px;
      }
    }

    @media (max-width: 500px) {
      .header {
        padding: 20px;
      }

      .product-image {
        height: 360px;
      }

      h1 {
        font-size: 36px;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <a href="index.html" class="logo">CASA AURA</a>
    <a href="index.html" class="back">← BACK TO COLLECTION</a>
  </header>

  <main id="app">
    <div class="loading">Loading fragrance...</div>
  </main>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL = "https://tmxpuurukwgeckpgfdhm.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_pyRgGZxtK_Hbi5DirVLLiA_IkxXdHq_";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const app = document.getElementById("app");

    const params = new URLSearchParams(window.location.search);
    const slug = params.get("slug");

    let selectedSize = null;
    let selectedPrice = null;
    let selectedInventory = 0;
    let currentProduct = null;

    function escapeHtml(value = "") {
      return String(value).replace(/[&<>"']/g, function (char) {
        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        }[char];
      });
    }

    async function loadProduct() {
      if (!slug) {
        app.innerHTML = `
          <div class="error">
            Fragrance not found.
          </div>
        `;
        return;
      }

      const { data, error } = await supabase
        .from("products")
        .select(`
          id,
          brand,
          name,
          category,
          description,
          notes,
          image_url,
          slug,
          product_sizes (
            id,
            size_ml,
            price,
            inventory
          )
        `)
        .eq("slug", slug)
        .eq("published", true)
        .single();

      if (error || !data) {
        console.error(error);

        app.innerHTML = `
          <div class="error">
            This fragrance could not be found.
          </div>
        `;
        return;
      }

      currentProduct = data;

      const sizes = (data.product_sizes || [])
        .sort((a, b) => a.size_ml - b.size_ml);

      if (sizes.length > 0) {
        selectedSize = sizes[0].size_ml;
        selectedPrice = Number(sizes[0].price);
        selectedInventory = Number(sizes[0].inventory);
      }

      document.title = `${data.brand} ${data.name} | Casa Aura`;

      app.innerHTML = `
        <section class="product-page">

          <div class="product-image">
            ${
              data.image_url
                ? `<img src="${escapeHtml(data.image_url)}"
                        alt="${escapeHtml(data.brand + " " + data.name)}">`
                : ""
            }
          </div>

          <div class="product-details">

            <div class="brand">
              ${escapeHtml(data.brand)}
            </div>

            <h1>
              ${escapeHtml(data.name)}
            </h1>

            ${
              data.description
                ? `<div class="description">
                    ${escapeHtml(data.description)}
                  </div>`
                : ""
            }

            ${
              data.notes
                ? `
                  <div class="notes-title">Notes</div>
                  <div class="notes">
                    ${escapeHtml(data.notes)}
                  </div>
                `
                : ""
            }

            <div class="size-title">Select Size</div>

            <div class="sizes">
              ${
                sizes.length
                  ? sizes.map(size => `
                    <button
                      class="size-button ${size.size_ml === selectedSize ? "active" : ""}"
                      data-size="${size.size_ml}"
                      data-price="${size.price}"
                      data-inventory="${size.inventory}">
                      ${size.size_ml}ml
                    </button>
                  `).join("")
                  : `<span class="notes">No sizes available.</span>`
              }
            </div>

            <div class="price" id="price">
              ${sizes.length ? `$${selectedPrice.toFixed(2)}` : "Unavailable"}
            </div>

            <div class="inventory" id="inventory">
              ${
                sizes.length
                  ? selectedInventory > 0
                    ? `${selectedInventory} available`
                    : "Out of stock"
                  : ""
              }
            </div>

            <button
              class="add-cart"
              id="add-cart"
              ${!sizes.length || selectedInventory <= 0 ? "disabled" : ""}>
              Add to Cart
            </button>

            <div class="message" id="message"></div>

          </div>
        </section>
      `;

      document.querySelectorAll(".size-button").forEach(button => {
        button.addEventListener("click", () => {
          document.querySelectorAll(".size-button")
            .forEach(btn => btn.classList.remove("active"));

          button.classList.add("active");

          selectedSize = Number(button.dataset.size);
          selectedPrice = Number(button.dataset.price);
          selectedInventory = Number(button.dataset.inventory);

          document.getElementById("price").textContent =
            `$${selectedPrice.toFixed(2)}`;

          document.getElementById("inventory").textContent =
            selectedInventory > 0
              ? `${selectedInventory} available`
              : "Out of stock";

          const addButton = document.getElementById("add-cart");

          addButton.disabled = selectedInventory <= 0;
        });
      });

      document.getElementById("add-cart")
        ?.addEventListener("click", addToCart);
    }

    function addToCart() {
      if (!currentProduct || !selectedSize || selectedInventory <= 0) {
        return;
      }

      const cart = JSON.parse(
        localStorage.getItem("casaAuraCart") || "[]"
      );

      const existing = cart.find(item =>
        item.productId === currentProduct.id &&
        item.sizeMl === selectedSize
      );

      if (existing) {
        if (existing.quantity < selectedInventory) {
          existing.quantity += 1;
        }
      } else {
        cart.push({
          productId: currentProduct.id,
          brand: currentProduct.brand,
          name: currentProduct.name,
          imageUrl: currentProduct.image_url,
          sizeMl: selectedSize,
          price: selectedPrice,
          quantity: 1
        });
      }

      localStorage.setItem(
        "casaAuraCart",
        JSON.stringify(cart)
      );

      document.getElementById("message").textContent =
        "Added to your cart.";
    }

    loadProduct();
  </script>

</body>
</html>
